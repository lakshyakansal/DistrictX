services:
  db:
    image: postgres:16
    container_name: districtx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: districtx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - districtx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d districtx"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  districtx_pgdata:
