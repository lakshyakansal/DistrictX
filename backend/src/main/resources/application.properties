spring.application.name=districtx-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/districtx}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:DistrictXLocalDevelopmentSecretKeyMustBeAtLeastThirtyTwoChars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
